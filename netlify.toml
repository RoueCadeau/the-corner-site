[build]
  publish = "."

# Sécurité supplémentaire : force la redirection vers HTTPS si jamais une requête
# arrive en HTTP (le gros du travail est fait par l'interrupteur "Force HTTPS"
# à activer dans Netlify une fois le domaine connecté, voir le README de lancement).
[[redirects]]
  from = "http://cafethecorner.fr/*"
  to = "https://cafethecorner.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.cafethecorner.fr/*"
  to = "https://www.cafethecorner.fr/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
